<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Привет! Rus tili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--card:#fff;--ink:#4B4B4B;--strong:#3C3C3C;--mut:#AFAFAF;--line:#E5E5E5;
  --g:#58CC02;--gd:#58A700;--b:#1CB0F6;--bd:#1899D6;--r:#FF4B4B;--rd:#EA2B2B;
  --y:#FFC800;--yd:#E5B400;--o:#FF9600;--p:#CE82FF;--pd:#A560D6;--lk:#E5E5E5;--lkd:#CECECE;
  --okbg:#D7FFB8;--okfg:#58A700;--badbg:#FFDFE0;--badfg:#EA2B2B;--selbg:#DDF4FF;
  --f:Nunito,"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131F24;--card:#1B2B32;--ink:#DCE6EA;--strong:#F1F7FB;--mut:#6B7F89;--line:#37464F;
  --lk:#37464F;--lkd:#2B3A42;--okbg:#1E3A10;--okfg:#89E219;--badbg:#3F1D1F;--badfg:#FF7878;--selbg:#12303F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131F24;--card:#1B2B32;--ink:#DCE6EA;--strong:#F1F7FB;--mut:#6B7F89;--line:#37464F;
  --lk:#37464F;--lkd:#2B3A42;--okbg:#1E3A10;--okfg:#89E219;--badbg:#3F1D1F;--badfg:#FF7878;--selbg:#12303F;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:800;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);--u:min(1px,.25vw)}
#mn,#stage{flex:1;min-height:0;display:flex;flex-direction:column}
#mn[hidden],#stage[hidden]{display:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
h1,h2{margin:0;font-weight:900;color:var(--strong)}
p{margin:6px 0}
.mu{color:var(--mut)}
@media(min-width:600px){#app{border-left:2px solid var(--line);border-right:2px solid var(--line)}}

/* Tugmalar */
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-bottom:5px solid var(--gd);border-radius:16px;padding:14px 18px;font-size:16px;letter-spacing:.6px;text-transform:uppercase;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--lk);border-color:var(--lkd);color:var(--mut);cursor:default}
.btn.o{background:var(--card);color:var(--b);border:2px solid var(--line);border-bottom-width:5px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:15px;white-space:nowrap}

/* Bosh sahifa */
.stats{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid var(--line);font-size:clamp(16px,4.6vw,19px);flex:none}
.stats span{display:flex;align-items:center;gap:6px}
.stats .fl{width:30px;height:21px;border-radius:5px;border:2px solid var(--line);background:linear-gradient(#fff 0 33.3%,#1C57A5 33.3% 66.6%,#D52B1E 66.6%)}
.sc{flex:1;min-height:0;overflow-y:auto;padding:0 16px calc(30px + env(safe-area-inset-bottom,0px))}
.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;border-radius:18px;border-bottom:5px solid;padding:14px 18px;margin:18px 0 26px}
.unit small{opacity:.85;font-size:13px;display:block;letter-spacing:.08em}
.unit b{font-size:clamp(18px,5.4vw,22px);display:block;margin:2px 0}
.unit span{font-size:15px;opacity:.95}
.unit .ic{font-size:34px;flex:none}
.nw{display:flex;flex-direction:column;align-items:center;margin-bottom:22px;position:relative}
.node{width:78px;height:72px;border-radius:50%;border:0;border-bottom:8px solid var(--gd);background:var(--g);font-size:30px;display:grid;place-items:center;color:#fff}
.node:active{transform:translateY(5px);border-bottom-width:3px}
.node.lock{background:var(--lk);border-color:var(--lkd);color:var(--mut)}
.node.done{background:var(--y);border-color:var(--yd)}
.nl{margin-top:8px;text-align:center;color:var(--strong);font-size:15px}
.nl small{display:block;color:var(--mut);font-size:13px}
.bub{position:absolute;top:-40px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-size:14px;color:var(--g);white-space:nowrap;letter-spacing:.06em}
.bub:after{content:"";position:absolute;bottom:-7px;left:50%;width:10px;height:10px;background:var(--bg);border:solid var(--line);border-width:0 2px 2px 0;transform:translateX(-50%) rotate(45deg)}
.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:12px 14px;margin-bottom:12px}
.gcard:active{transform:translateY(3px);border-bottom-width:3px}
.gcard .gi{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex:none}
.gcard .gt{flex:1;min-width:0}
.gcard b{display:block;font-size:18px;color:var(--strong)}
.gcard small{display:block;color:var(--mut);font-size:14px;font-weight:700}
.gcard em{font-style:normal;color:var(--o);font-size:14px}
.gcard .go{background:var(--g);color:#fff;border-radius:12px;border-bottom:4px solid var(--gd);padding:8px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.foot2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.foot2 button{background:none;border:0;color:var(--mut);font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:10px}

/* Dars */
.head{display:flex;align-items:center;gap:12px;padding:16px 16px 8px;flex:none}
.x{background:none;border:0;font-size:26px;color:var(--mut);padding:0 4px;line-height:1}
.bar{flex:1;height:16px;background:var(--line);border-radius:9px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s;position:relative}
.bar i:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
.lsc{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:18px}
.lsc h2{font-size:clamp(20px,6vw,25px)}
.learn{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin:auto 0}
.tag{background:var(--selbg);color:var(--b);border-radius:999px;padding:6px 14px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.card{width:100%;border:2px solid var(--line);border-bottom-width:6px;border-radius:24px;background:var(--card);padding:clamp(16px,5vw,26px) 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.card .em{font-size:clamp(64px,22vw,96px);line-height:1.1}
.lw{font-size:clamp(30px,10vw,44px);font-weight:900;line-height:1.15;overflow-wrap:anywhere;color:var(--strong)}
.pr{color:var(--b);font-size:clamp(17px,5vw,20px)}
.lu{font-size:clamp(20px,6vw,26px);color:var(--strong)}
.note{background:var(--selbg);color:var(--b);border-radius:14px;padding:12px 14px;font-size:15px;text-align:left;width:100%}
.snd .big{width:76px;height:70px;border-radius:20px;background:var(--b);color:#fff;border:0;border-bottom:6px solid var(--bd);font-size:34px;display:grid;place-items:center}
.snd .big:active{transform:translateY(4px);border-bottom-width:2px}
.mas{display:flex;align-items:center;gap:10px}
.mas .mo{font-size:clamp(50px,16vw,68px);line-height:1;flex:none}
.say{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:clamp(18px,5.4vw,22px);color:var(--strong);background:var(--card);overflow-wrap:anywhere}
.say:before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;background:var(--card);border:solid var(--line);border-width:0 0 2px 2px;transform:translateY(-50%) rotate(45deg)}
.say .spk{background:none;border:0;font-size:26px;padding:0;flex:none}
.pic1{text-align:center;background:var(--card);border:2px solid var(--line);border-bottom-width:6px;border-radius:24px;padding:14px}
.pic1 .em{font-size:clamp(64px,22vw,90px);line-height:1.1}
.opts{display:grid;gap:10px}
.opts.pics{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;font-size:clamp(16px,4.8vw,18px);line-height:1.3}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:3px}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mut)}
.opt small{display:block;font-weight:700;color:var(--mut);font-size:14px}
.opt.pic{justify-content:center;font-size:clamp(40px,14vw,60px);padding:12px 0}
.opt.sel{border-color:var(--b);background:var(--selbg);color:var(--b)}
.opt.sel .k{border-color:var(--b);color:var(--b)}
.opt.good{border-color:var(--g);background:var(--okbg);color:var(--okfg)}
.opt.bad{border-color:var(--r);background:var(--badbg);color:var(--badfg)}
.opt:disabled{cursor:default}
.dock{flex:none;border-top:2px solid var(--line);padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));background:var(--bg);display:grid;gap:12px}
.dock.ok{background:var(--okbg);border-color:transparent;color:var(--okfg)}
.dock.no{background:var(--badbg);border-color:transparent;color:var(--badfg)}
.dock.no .btn{background:var(--r);border-color:var(--rd)}
.fb{display:none;align-items:center;gap:12px}
.dock.ok .fb,.dock.no .fb{display:flex}
.fb .ic{width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:24px;flex:none}
.fb .ft{font-size:clamp(19px,5.6vw,22px);font-weight:900}
.fb .fs{font-size:16px}
.end{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
.end .mo{font-size:clamp(64px,22vw,96px);line-height:1}
.end h1{font-size:clamp(26px,8vw,32px);color:var(--y)}
.stars{font-size:38px;letter-spacing:4px}
.cards{display:flex;gap:10px;margin:12px 0;width:100%;justify-content:center}
.cd{border:2px solid;border-radius:16px;flex:1;max-width:130px;min-width:0;overflow:hidden;background:var(--card)}
.cd small{display:block;color:#fff;padding:4px 6px;font-size:12px;letter-spacing:.06em}
.cd b{display:block;padding:12px 4px;font-size:clamp(16px,5vw,22px)}

/* O'yin */
#stage{padding:0 16px}
#stage .head{padding:16px 0 8px}
#stage .head .sp{flex:1}
.tg{display:flex;align-items:center;gap:10px;margin:4px 0 12px;flex:none}
.tg .mo{font-size:clamp(44px,13vw,56px);line-height:1;flex:none}
.tg .say{display:block}
.tg small{display:block;color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tg b{display:block;font-size:clamp(20px,6vw,26px);color:var(--b);line-height:1.2}
.cw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.cvw{position:relative;width:240px;height:360px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 2px var(--line),0 6px 0 2px var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.ov{position:absolute;inset:0;background:rgba(19,31,36,.88);display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center;color:#fff;padding:18px;overflow-y:auto}
.ov[hidden]{display:none}
.ov h2{color:#fff;font-size:22px}
.ov .big{font-size:42px;font-weight:900}
.ov .opts{margin-top:8px}
.ov .btn.o{background:#fff;color:#1CB0F6;border-color:#E5E5E5}
.cf{position:fixed;top:-40px;font-style:normal;pointer-events:none;z-index:9;animation:cf 2s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;background:var(--strong);color:var(--bg);border-radius:16px;padding:12px 16px;font-weight:800;z-index:20}

/* Boshlash ekrani */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px}
.splash .btn{max-width:320px}
.camel{width:190px}
.camel svg{display:block;width:100%}

@media(max-height:620px){.end .mo{font-size:56px}.lsc{gap:10px}.dock{padding-top:10px}}
@media(prefers-reduced-motion:no-preference){
  .bub{animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}
  .camel{animation:bob2 1s ease-in-out infinite alternate}@keyframes bob2{to{transform:translateY(-8px)}}
  .shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pop{animation:pp .6s}@keyframes pp{50%{transform:scale(1.3) rotate(-8deg)}}
  .lsc>*{animation:rise .25s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .an-wave{animation:wave 1.6s ease-in-out infinite;transform-origin:70% 80%}
  .an-bounce{animation:bnc 1.1s ease-in-out infinite}
  .an-pulse{animation:pls 1.3s ease-in-out infinite}
  .an-spin{animation:spn 2.6s ease-in-out infinite}
  .an-shake{animation:shk2 1.4s ease-in-out infinite}
}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(18deg)}20%,40%{transform:rotate(-14deg)}}
@keyframes bnc{50%{transform:translateY(-8px) scale(1.08)}}
@keyframes pls{50%{transform:scale(1.18)}}
@keyframes spn{0%,70%,100%{transform:rotate(0)}85%{transform:rotate(360deg)}}
@keyframes shk2{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.cf{display:none}}
</style>
</head>

      <div class="cvw" id="cvw"><canvas id="cv"></canvas><div class="ov" id="ov" hidden></div></div>

</div>
<script>
const W=[["Здравствуйте","zdrást-vuyte","Assalomu alaykum"],["Привет","privét","Salom"],["Как дела?","kak dilá","Ishlar qanday?"],["Хорошо","xarashó","Yaxshi"],["Отлично","atlíchna","A'lo"],["Спасибо","spasíba","Rahmat"],["Пожалуйста","pazháluysta","Marhamat"],["До свидания","da svidániya","Xayr"],["Я","ya","Men"],["Ты","ti","Sen"],["Вы","vi","Siz"],["Он","on","U (erkak)"],["Она","aná","U (ayol)"],["Оно","anó","U (neytral)"],["Это","éta","Bu"],["Мой","moy","Mening (erkak)"],["Моя","maYá","Mening (ayol)"],["Моё","maYó","Mening (neytral)"]];
const P=["👋","🤗","😊","👍","🤩","🙏","🎁","🚶","🙋","🫵","👥","👨","👩","🧸","👉","🏠","📚","🍎"];
const AN=["wave","bounce","pulse","bounce","spin","pulse","bounce","wave","bounce","pulse","shake","bounce","pulse","shake","bounce","pulse","bounce","spin"];
const HT=["«в» o'qilmaydi: «zdrastuyte». Asli «sog' bo'ling» degani.","Faqat do'st va tengdoshlarga ayt.","Как = qanday, дела = ishlar. Aynan «Ishlar qanday?».","Urg'usiz O → A bo'ladi: «xarashó», «xorosho» emas.","«Otlichnik» (a'lochi o'quvchi) so'zini eslang!","Asli «Спаси Бог», ya'ni «Xudo asrasin».","Uzun, lekin tez ayt: «pajalusta».","До = gacha, свидание = uchrashuv: «ko'rishguncha».","Bitta harf, osonroq bo'lmaydi!","Yaqin do'st yoki tengdoshga «sen».","Hurmat bilan «Siz». Ko'plikda «Sizlar» ham shu.","Erkak kishi yoki erkak jinsli narsa.","Ayol kishi yoki ayol jinsli narsa.","Neytral narsa (jinsi yo'q).","Это книга = Bu kitob. «Bo'ladi» so'zi kerak emas.","Мой друг = Mening do'stim (erkak jinsli so'z bilan).","Моя книга = Mening kitobim (ayol jinsli so'z bilan).","Моё имя = Mening ismim (neytral so'z bilan)."];
const LV=[["Salomlashish va muloyimlik",0,8],["Olmoshlar",8,14],["Bu va mening",14,18]];

let st={xp:0,best:{},lv:{},days:0,last:""},G=null,L=null,raf,last;
try{Object.assign(st,JSON.parse(localStorage.getItem("rus2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("rus2",JSON.stringify(st))}catch(e){}};
{const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();if(st.last!=t){st.days=st.last==y?st.days+1:1;st.last=t;save()}}
const $=id=>document.getElementById(id),R=a=>a[Math.random()*a.length|0];
const shuf=a=>[...a].sort(()=>Math.random()-.5);

/* Tovush */
let ac;
const beep=(f,d=.1)=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};

try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}

function akey(t){return String(t).replace(/<[^>]*>/g,'').toLowerCase().replace(/[.,!?;:«»"“”…()–—]/g,' ').replace(/\s+/g,' ').trim();}
function unlockClip(){try{AUe=new Audio();AUe.src=SILC;var p=AUe.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function playClip(t,done){
  var d=AUDIO[akey(t)];if(!d)return false;
  try{if(!AUe)AUe=new Audio();AUe.onended=done||null;AUe.src=d;var p=AUe.play();if(p&&p.catch)p.catch(function(){});return true;}catch(e){return false;}
}

  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}
}
function say(t){
  if(!SOUND)return;
  if(playClip(t))return;
  const id=++SID;pickV();
  if(!VR||!("speechSynthesis" in window))return;
  let started=false;
  const u=new SpeechSynthesisUtterance(t);
  u.lang="ru-RU";u.rate=.85;u.voice=VR;
  u.onstart=()=>{started=true};
  
  window._u=u;
  try{speechSynthesis.cancel()}catch(e){}
  setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},80);
}

function pill(x,y,w,h,c){cx.beginPath();cx.roundRect(x-w/2,y-h/2+4,w,h,h/2);cx.fillStyle=c[1];cx.fill();cx.beginPath();cx.roundRect(x-w/2,y-h/2,w,h,h/2);cx.fillStyle=c[0];cx.fill()}
function tx(s,x,y,sz=16,c="#fff"){cx.font=`800 ${sz}px Nunito,system-ui,sans-serif`;cx.fillStyle=c;cx.textAlign="center";cx.textBaseline="middle";cx.fillText(s,x,y)}
const wid=(s,sz=16)=>{cx.font=`800 ${sz}px Nunito,system-ui,sans-serif`;return cx.measureText(s).width};
function ask(g){let n;do{n=R(W)}while(n===g.q);g.q=n;$("tgt").textContent=P[W.indexOf(n)]+" "+n[2]}
function burst(g,x,y,c="#FFC800"){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=60+Math.random()*140;g.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:.6,c})}}
function lose(g){g.lives--;g.shake=.3;beep(160,.25);if(g.lives<1)end()}
function hit(g,x,y,w){g.score++;burst(g,x,y);beep(720);setTimeout(()=>beep(920,.08),70);say(w[0])}
function gate(g,x){const q=R(W),o=R(W.filter(z=>z!==q)),t=Math.random()<.5;g.gs.push({x,q,t,a:t?q:o,b:t?o:q,p:false})}

const games={
m:{name:"Meteorlar",ic:"☄️",col:"--b",tag:"So'zlar yerga tushmasidan to'g'risini bos",lives:3,
how:"Tepadagi ma'noga mos ruscha so'zni meteor yerga tushmasidan bos. Xato bossang yoki to'g'ri so'z yerga tushsa, jon ketadi.",
init(g){g.items=[];g.nx=0;ask(g)},
update(g,dt){const v=70+Math.min(g.score*5,130);g.nx-=dt;const has=g.items.some(i=>i.w===g.q);
if((g.nx<=0||!has)&&g.items.length<9){g.nx=1.1-Math.min(g.score*.01,.4);const w=(!has||Math.random()<.4)?g.q:R(W.filter(x=>x!==g.q)),wd=wid(w[0])+26;g.items.push({w,wd,x:wd/2+6+Math.random()*(LW-wd-12),y:-20,bad:0})}
g.items=g.items.filter(i=>{i.y+=v*dt;i.bad-=dt;if(i.y>LH-40){if(i.w===g.q)lose(g);return false}return true})},
tap(g,x,y){const c=g.items.filter(i=>Math.abs(x-i.x)<i.wd/2+8&&Math.abs(y-i.y)<26).sort((a,b)=>b.y-a.y)[0];if(!c)return;
if(c.w===g.q){hit(g,c.x,c.y,c.w);g.items=g.items.filter(i=>i!==c);ask(g)}else{c.bad=.4;lose(g)}},
draw(g){g.items.forEach(i=>{pill(i.x,i.y,i.wd,34,i.bad>0?["#FF4B4B","#EA2B2B"]:col(i.w));tx(i.w[0],i.x,i.y+1)});cx.fillStyle="rgba(88,204,2,.28)";cx.fillRect(0,LH-30,LW,30);tx("🌍 Yer",LW/2,LH-15,13)}},
f:{name:"Parvoz",ic:"🐦",col:"--r",tag:"Bos va uch: to'g'ri so'zli darvozadan o't",lives:3,
how:"Ekranni bosib qush bilan uch. Tepadagi ma'noga mos ruscha so'zli darvozadan o't. Devorga urilsang yoki noto'g'ri darvozadan o'tsang bitta jon ketadi. 3 jon bor.",
init(g){g.y=270;g.vy=0;g.gs=[];gate(g,LW+60);g.hint=1},
update(g,dt){const sp=100+Math.min(g.score*2,40);g.inv=Math.max(0,(g.inv||0)-dt);g.vy+=800*dt;g.y+=g.vy*dt;
g.gs.forEach(o=>o.x-=sp*dt);g.gs=g.gs.filter(o=>o.x>-90);if(g.gs[g.gs.length-1].x<LW-220)gate(g,LW+20);
const n=g.gs.find(o=>!o.p);if(n&&n.q!==g.q){g.q=n.q;$("tgt").textContent=P[W.indexOf(n.q)]+" "+n.q[2]}
if(g.y<14){g.y=14;g.vy=0}if(g.y>LH-14){g.y=LH-14;g.vy=-300}
g.gs.forEach(o=>{if(90+13>o.x&&90-13<o.x+44){const ok=(g.y>53&&g.y<237)||(g.y>303&&g.y<487);if(!ok&&!g.inv){lose(g);g.inv=1.3;g.vy=0;g.y=o.t?145:395}}
if(!o.p&&90>o.x+22){o.p=true;if((g.y<270)===o.t)hit(g,90,g.y,o.q);else lose(g)}})},
tap(g){g.vy=-300;g.hint=0;beep(440,.04)},
draw(g){g.gs.forEach(o=>{[[0,40],[250,290],[500,540]].forEach(([a,b])=>{cx.fillStyle="#58A700";cx.fillRect(o.x,a,44,b-a);cx.fillStyle="#89E219";cx.fillRect(o.x,a,8,b-a)});
[[145,o.a],[395,o.b]].forEach(([y,w])=>{pill(o.x+22,y,wid(w[0],14)+18,30,col(w));tx(w[0],o.x+22,y+1,14)})});
cx.font="34px serif";cx.textAlign="center";cx.textBaseline="middle";cx.globalAlpha=g.inv>0?.5:1;cx.fillText("🐦",90,g.y);cx.globalAlpha=1;if(g.hint)tx("Bos va uch!",LW/2,LH-40,18)}},
z:{name:"Zarba",ic:"🐹",col:"--g",tag:"Teshikdan chiqqan to'g'ri so'zni tez ur",lives:3,
how:"Teshiklardan sichqonlar so'z bilan chiqadi. Faqat tepadagi ma'noga mos so'zni urib ol. 45 soniya vaqting bor.",
init(g){g.cs=Array.from({length:9},(_,i)=>({x:63+117*(i%3),y:200+125*(i/3|0),w:null,t:0,m:1}));g.nx=.3;g.time=45;ask(g)},
update(g,dt){g.time-=dt;if(g.time<=0)return end();g.nx-=dt;
if(g.nx<=0){g.nx=.55-Math.min(g.score*.01,.2);const e=g.cs.filter(c=>!c.w);if(e.length){const c=R(e),has=g.cs.some(k=>k.w===g.q);c.w=(!has||Math.random()<.35)?g.q:R(W.filter(x=>x!==g.q));c.m=c.t=1.8-Math.min(g.score*.02,.7)}}
g.cs.forEach(c=>{if(c.w){c.t-=dt;if(c.t<=0){if(c.w===g.q)lose(g);c.w=null}}})},
tap(g,x,y){const c=g.cs.find(c=>c.w&&Math.abs(x-c.x)<58&&Math.abs(y-c.y)<64);if(!c)return;
if(c.w===g.q){hit(g,c.x,c.y,c.w);c.w=null;ask(g)}else{c.w=null;lose(g)}},
draw(g){g.cs.forEach(c=>{cx.fillStyle="#0B1418";cx.beginPath();cx.ellipse(c.x,c.y+34,48,16,0,0,6.28);cx.fill();
if(c.w){const s=Math.max(.05,Math.min(1,(c.m-c.t)/.15,c.t/.15));cx.save();cx.translate(c.x,c.y+30);cx.scale(s,s);cx.font="44px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText("🐹",0,-30);pill(0,6,wid(c.w[0],14)+16,28,col(c.w));tx(c.w[0],0,7,14);cx.restore()}})}}
};
function ov(h){$("ov").innerHTML=h;$("ov").hidden=false}
function hud(){const s=(G.k=="z"?`⏱ ${Math.max(0,Math.ceil(G.time))} · `:"")+`⭐ ${G.score}`,l="❤️".repeat(Math.max(0,G.lives))+"🖤".repeat(G.max-Math.max(0,G.lives));if($("hs").textContent!=s)$("hs").textContent=s;if($("hl").textContent!=l)$("hl").textContent=l}
function render(){cx.save();cx.clearRect(0,0,LW,LH);const b=cx.createLinearGradient(0,0,0,LH);b.addColorStop(0,"#1F3640");b.addColorStop(1,"#131F24");cx.fillStyle=b;cx.fillRect(0,0,LW,LH);
cx.fillStyle="rgba(255,255,255,.45)";stars.forEach(s=>cx.fillRect(s[0],s[1],s[2],s[2]));
if(G.shake>0)cx.translate((Math.random()-.5)*G.shake*30,(Math.random()-.5)*G.shake*30);
G.d.draw(G);G.pt.forEach(p=>{cx.globalAlpha=Math.max(0,p.l*1.6);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,5,5)});cx.restore()}
function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;
if(!G.over)G.d.update(G,dt);else G.oa+=dt;
G.pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt});G.pt=G.pt.filter(p=>p.l>0);G.shake=Math.max(0,G.shake-dt);
render();hud();if(!G.over||G.oa<.8)raf=requestAnimationFrame(loop)}
function play(k){cancelAnimationFrame(raf);L=null;const d=games[k];G={k,d,score:0,lives:d.lives,max:d.lives,pt:[],shake:0,over:false,oa:0,go:false};
$("mn").hidden=true;$("stage").hidden=false;$("tgt").textContent="·";fit();d.init(G);render();hud();
ov(`<div style="font-size:56px">${d.ic}</div><h2>${d.name}</h2><p>${d.how}</p><button class="btn" onclick="go()">Boshlash</button>`)}
function go(){$("ov").hidden=true;G.go=true;last=performance.now();raf=requestAnimationFrame(loop)}
function end(){if(G.over)return;G.over=true;beep(150,.4);const g=G,x=g.score*3,nb=g.score>(st.best[g.k]||0);st.xp+=x;if(nb)st.best[g.k]=g.score;save();
setTimeout(()=>{if(G!==g)return;ov(`<div style="font-size:52px">${nb?"🏆":"💥"}</div><h2>${nb?"Yangi rekord!":"O'yin tugadi"}</h2><p class="big">${g.score}</p><p>Rekord: ${st.best[g.k]||0} · +${x} XP</p><div class="opts"><button class="btn" onclick="play('${g.k}')">Qayta o'ynash</button><button class="btn o" onclick="home()">Menyu</button></div>`);if(nb)conf()},650)}
cv.addEventListener("pointerdown",e=>{e.preventDefault();if(!G||G.over||!G.go)return;const r=cv.getBoundingClientRect();G.d.tap(G,(e.clientX-r.left)/r.width*LW,(e.clientY-r.top)/r.height*LH)});
function conf(){for(let i=0;i<36;i++){const e=document.createElement("i");e.textContent=["🎉","⭐","✨","🪙","🔥"][i%5];e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.7}s;font-size:${18+Math.random()*18}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}
function thm(){const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))=="dark"?"light":"dark"}
function clr(){if(confirm("Barcha natijalar o'chiriladi. Davom etamizmi?")){st.xp=0;st.best={};st.lv={};save();home()}}

/* Bosh sahifa */
const OFF=[0,46,72];
const unl=k=>k===0||!!st.lv[k-1];
function home(){
  cancelAnimationFrame(raf);G=null;L=null;$("stage").hidden=true;$("mn").hidden=false;
  const path=LV.map((l,k)=>{
    const s=st.lv[k]||0,state=s?"done":unl(k)?"cur":"lock";
    return `<div class="nw" style="transform:translateX(calc(${OFF[k%3]} * var(--u)))">${state==="cur"?'<span class="bub">BOSHLASH</span>':""}<button class="node ${state==="cur"?"":state}" onclick="nodeGo(${k},this)" aria-label="${k+1}-bosqich: ${l[0]}">${state==="lock"?"🔒":state==="done"?"✓":"⭐"}</button><span class="nl">${l[0]}<small>${s?"⭐".repeat(s):(l[2]-l[1])+" ta so'z"}</small></span></div>`}).join("");
  const gm=Object.entries(games).map(([k,d])=>`<button class="gcard" onclick="play('${k}')"><span class="gi" style="background:var(${d.col})">${d.ic}</span><span class="gt"><b>${d.name}</b><small>${d.tag}</small><em>Rekord: ${st.best[k]||0}</em></span><span class="go">O'yna</span></button>`).join("");
  $("mn").innerHTML=`<div class="stats"><span class="fl" aria-label="Rus tili"></span><span style="color:var(--o)">🔥 ${st.days}</span><span style="color:var(--b)">💎 ${st.xp}</span></div>
<div class="sc">
<div class="unit" style="background:var(--g);border-color:var(--gd)"><div><small>1-BO'LIM</small><b>Birinchi so'zlar</b><span>Здравствуйте!</span></div><span class="ic">🦉</span></div>
${path}
<div class="unit" style="background:var(--p);border-color:var(--pd)"><div><small>2-BO'LIM</small><b>O'yinlar</b><span>So'zlarni o'yin bilan mustahkamla</span></div><span class="ic">🎮</span></div>
${gm}
<div class="foot2"><button onclick="thm()">Yorug' / qorong'i</button><button onclick="clr()">Natijalarni tozalash</button></div>
</div>`;
  const c=document.querySelector(".node:not(.lock):not(.done)");if(c)c.scrollIntoView({block:"center"});
}
function nodeGo(k,b){if(unl(k))lvStart(k);else{b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);beep(180)}}

/* Dars */
const pg=v=>`<div class="bar"><i style="width:${Math.round(v*100)}%"></i></div>`;
const lhead=v=>`<div class="head"><button class="x" onclick="home()" aria-label="Chiqish">✕</button>${pg(v)}<span class="chip">⭐ ${st.xp}</span></div>`;
function lvStart(k){cancelAnimationFrame(raf);G=null;$("stage").hidden=true;$("mn").hidden=false;
  const ids=[];for(let i=LV[k][1];i<LV[k][2];i++)ids.push(i);
  const g=[];for(let i=0;i<ids.length;i+=4)g.push(ids.slice(i,i+4));
  L={k,g,gi:0,ti:0,q:[],qd:0,ok:0,miss:0,xp:0,lock:false,sel:null};teach()}
function teach(){
  const gr=L.g[L.gi],i=gr[L.ti],w=W[i],lastW=L.ti+1>=gr.length;
  $("mn").innerHTML=lhead((L.gi+L.ti/(gr.length*2))/L.g.length)+
  `<div class="lsc"><div class="learn"><span class="tag">Yangi so'z ${L.ti+1} / ${gr.length}</span>
  <div class="card"><div class="em">${pic(i)}</div><div class="lw">${w[0]}</div><div class="pr">[${w[1]}]</div><div class="lu">${w[2]}</div></div>
  <div class="snd"><button class="big" onclick="say(W[${i}][0])" aria-label="Eshitish">🔊</button></div>
  <div class="note">${HT[i]}</div></div></div>
  <div class="dock"><button class="btn" id="nxb" onclick="tnext()">${lastW?"Sinab ko'ramiz":"Davom etish"}</button></div>`;
  setTimeout(()=>say(w[0]),250);
}
function tnext(){const gr=L.g[L.gi];L.ti++;if(L.ti>=gr.length){L.q=shuf(gr);L.qd=0;qz()}else teach()}
function qz(){
  const gr=L.g[L.gi];
  if(!L.q.length){L.gi++;L.ti=0;return L.gi>=L.g.length?lvEnd():teach()}
  const i=L.q[0],w=W[i],A=Math.random()<.5;L.cur=i;L.lock=false;L.sel=null;L.A=A;
  const o=shuf([i,...shuf([...W.keys()].filter(k=>k!=i)).slice(0,3)]);
  const top=A
   ?`<h2>Ruscha qaysi?</h2><div class="pic1"><div class="em">${pic(i)}</div></div><div class="mas"><span class="mo">🦉</span><div class="say">${w[2]}</div></div>`
   :`<h2>Qaysi rasm?</h2><div class="mas"><span class="mo">🦉</span><div class="say"><button class="spk" onclick="say(W[${i}][0])" aria-label="Eshitish">🔊</button><span>${w[0]}<br><small class="mu">${w[2]}</small></span></div></div>`;
  const opts=o.map((k,n)=>A
   ?`<button class="opt" data-k="${k}" onclick="qa(${k},this)"><span class="k">${n+1}</span><span>${W[k][0]}<small>[${W[k][1]}]</small></span></button>`
   :`<button class="opt pic" data-k="${k}" onclick="qa(${k},this)">${P[k]}</button>`).join("");
  $("mn").innerHTML=lhead((L.gi+.5+.5*L.qd/gr.length)/L.g.length)+
  `<div class="lsc">${top}<div class="opts ${A?"":"pics"}">${opts}</div></div>
  <div class="dock" id="dk"><div class="fb"><span class="ic" id="fi"></span><div><div class="ft" id="ft"></div><div class="fs" id="fs"></div></div></div><button class="btn" id="chk" disabled onclick="chk()">Tekshirish</button></div>`;
  if(!A)say(w[0]);
}
function qa(k,b){
  if(L.lock)return;L.sel=k;
  document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel");$("chk").disabled=false;
  if(L.A)say(W[k][0]);
}
function chk(){
  if(L.lock||L.sel==null)return;L.lock=true;
  const k=L.sel,ok=k===L.cur;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const bk=+b.dataset.k;b.classList.remove("sel");if(bk===L.cur)b.classList.add("good");else if(bk===k)b.classList.add("bad")});
  $("dk").className="dock "+(ok?"ok":"no");
  if(ok){L.ok++;L.xp+=2;L.qd++;st.xp+=2;save();L.q.shift();beep(720);setTimeout(()=>beep(920,.08),70)}
  else{L.miss++;L.q.push(L.q.shift());beep(160,.25)}
  say(W[L.cur][0]);
  $("fi").textContent=ok?"✔":"✖";
  $("ft").textContent=ok?R(["Ajoyib!","Barakalla!","Zo'r!","Mukammal!","To'g'ri!"]):"To'g'ri javob:";
  $("fs").textContent=ok?"":W[L.cur][0]+" · "+W[L.cur][2];
  const c=$("chk");c.textContent="Davom etish";c.disabled=false;c.onclick=qz;
}
function lvEnd(){
  const s3=L.miss==0?3:L.miss<=3?2:1,bonus=s3*5;
  st.lv[L.k]=Math.max(st.lv[L.k]||0,s3);st.xp+=bonus;save();
  const acc=Math.round(L.ok/((L.ok+L.miss)||1)*100),k=L.k;
  $("mn").innerHTML=`<div class="end"><div class="mo pop">🦉</div><h1>Bosqich tugadi!</h1><div class="stars">${"⭐".repeat(s3)}</div>
  <p class="mu">${LV[k][0]}</p>
  <div class="cards"><div class="cd" style="border-color:var(--y)"><small style="background:var(--y)">JAMI XP</small><b style="color:var(--yd)">⚡ ${L.xp+bonus}</b></div><div class="cd" style="border-color:var(--g)"><small style="background:var(--g)">ANIQLIK</small><b style="color:var(--g)">🎯 ${acc}%</b></div><div class="cd" style="border-color:var(--b)"><small style="background:var(--b)">XATO</small><b style="color:var(--b)">✖ ${L.miss}</b></div></div>
  ${k==2?`<div class="note">Eslab qol: Мой / Моя / Моё narsaning jinsiga qarab tanlanadi: -й erkak, -я ayol, -ё neytral.</div>`:""}</div>
  <div class="dock">${k<2?`<button class="btn" onclick="lvStart(${k+1})">Keyingi bosqich</button>`:`<button class="btn" onclick="home()">Davom etish</button>`}<button class="btn o" onclick="lvStart(${k})">Qayta o'tish</button><button class="btn o" onclick="play('m')">☄️ O'yinda sinab ko'r</button></div>`;
  if(s3>1)conf();
}
document.addEventListener("keydown",e=>{
  if(G&&G.go&&!G.over&&e.code=="Space"){e.preventDefault();G.d.tap(G,0,0);return}
  if(e.key==="Enter"&&L&&!$("mn").hidden){const b=$("chk")||$("nxb");if(b&&!b.disabled&&document.activeElement!==b){e.preventDefault();b.click()}}
});

/* ===== Birinchi ekran: tuya va "Boshlash" tugmasi ===== */
const CAMEL='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#d9a05b"><path d="M16 58Q8 62 10 78" stroke="#c98b45" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="24" y="70" width="9" height="24" rx="4.5"/><rect x="38" y="72" width="9" height="22" rx="4.5"/><rect x="56" y="72" width="9" height="22" rx="4.5"/><rect x="70" y="70" width="9" height="24" rx="4.5"/><ellipse cx="37" cy="38" rx="11" ry="15" fill="#c98b45"/><ellipse cx="60" cy="38" rx="11" ry="15" fill="#c98b45"/><ellipse cx="49" cy="62" rx="32" ry="19"/><path d="M66 58Q80 54 76 30L90 30Q92 58 82 72Z"/><ellipse cx="85" cy="26" rx="12" ry="9"/></g><ellipse cx="49" cy="64" rx="15" ry="9" fill="#1cb0f6"/><ellipse cx="49" cy="64" rx="8" ry="4" fill="#ffc800"/><ellipse cx="78" cy="15" rx="3" ry="5" fill="#c98b45"/><circle cx="83" cy="23" r="3.5" fill="#3c3c3c"/><circle cx="84" cy="22" r="1.2" fill="#fff"/><circle cx="90" cy="30" r="3" fill="#ff8a8a" opacity=".7"/><path d="M92 25q2 1 2 4" stroke="#8a5a28" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
function splash(){
  $("mn").innerHTML='<div class="splash"><div class="camel">'+CAMEL+'</div><button class="btn" id="stt">Boshlash</button></div>';
  $("stt").onclick=()=>{
    SOUND=true;
    unlock();
    setTimeout(()=>say("Привет!"),150);
    home();
  };
}
splash();
</script>
</body>
</html>
